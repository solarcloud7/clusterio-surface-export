[mod-setting-name]
surfexp-platform-boarding=Allow platform boarding
surfexp-gateway-instances=Server destinations

[mod-setting-description]
surfexp-platform-boarding=Allow players to board another enabled platform at the same space location on this instance. Platforms transferring or protected by recovery are unavailable. Requires the Surface Export Clusterio plugin.
surfexp-gateway-instances=Comma-separated Clusterio instance ids, each followed by =Friendly name, for example 836570928=Forge,902099405=Cinder. Each becomes a destination beside the Gateway that a platform schedule can stop at; stopping there sends the platform to that server, which it enters at its Gateway. Managed by the Surface Export plugin and its reconciler; keep it identical on every server.

[space-location-description]
surfexp_gateway_hub=A surface_export transfer gateway. A space platform that parks here can be sent to any linked instance.
surfexp_gateway_1=A surface_export transfer gateway. A space platform that parks here is sent to the linked instance.
surfexp_gateway_2=A surface_export transfer gateway. A space platform that parks here is sent to the linked instance.
surfexp_gateway_3=A surface_export transfer gateway. A space platform that parks here is sent to the linked instance.
surfexp_gateway_4=A surface_export transfer gateway. A space platform that parks here is sent to the linked instance.
surfexp_gateway_instance=The way to __1__. A space platform that stops here is sent to that server and arrives at its Gateway.

[item-name]
selection-lab-tool=Selection Lab

[item-description]
selection-lab-tool=Copy/paste a factory chunk WITH all contents through the real surface-export pipeline (debug tool).\n[color=blue]Drag[/color] - COPY the selection (entities, belt items, inventories, fluids, state)\n[color=green]Shift + Drag[/color] - PASTE, all-or-nothing: refuses if ANY entity target is occupied (conflicts red + error sound)\n[color=orange]Ctrl + Drag[/color] - AUDIT: counts the selection with the transfer gate's own meters (items/entities/fluids + delta vs last audit)\n[color=red]Ctrl + Shift + Drag[/color] - FORCE paste: replaces blockers (never characters, hubs, other forces); fully undoable\n[color=yellow]Ctrl + Alt + Z / Y[/color] - UNDO / REDO the last paste (blockers come back with contents)\nSame surface only. No wire reconnection or rotation. Requires debug_mode.

[shortcut-name]
selection-lab-tool=Selection Lab

[controls]
selection-lab-undo=Selection Lab: undo paste
selection-lab-redo=Selection Lab: redo paste

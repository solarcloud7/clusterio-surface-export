name: Feature request
description: Describe a use case or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the workflow and what is currently difficult or missing.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Desired result
      description: Describe how you would know the improvement works. Include alternatives or an existing workaround if useful.
    validations:
      required: true

name: CI — Test & Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  # No branch filter, deliberately: a stacked PR (base = another feature branch) must still run CI.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PLUGIN_DIR: docker/seed-data/external_plugins/surface_export

jobs:
  # ===========================================================================
  # Fast checks — lint + both unit-test packages, parallel to the cluster job.
  # ===========================================================================
  fast-checks:
    name: Fast checks (lint + unit)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ${{ env.PLUGIN_DIR }}/package-lock.json

      # --ignore-scripts: `npm test` runs its own build:node, so the prepare lifecycle would build twice.
      - name: Install (plugin, no lifecycle scripts)
        working-directory: ${{ env.PLUGIN_DIR }}
        timeout-minutes: 10
        run: |
          NPM_FLAGS="--ignore-scripts --fetch-retries=5 --fetch-timeout=120000 --fetch-retry-maxtimeout=60000"
          npm ci $NPM_FLAGS || { echo "::warning::npm ci stalled/failed once — retrying"; npm ci $NPM_FLAGS; }

      - name: Lint (all correctness guards)
        working-directory: ${{ env.PLUGIN_DIR }}
        run: npm run lint

      # Two separate packages: the plugin's test/*.test.cjs and the repo root's tests/**/*.test.mjs.
      # The root glob is required — `node --test tests/` would also run non-test data modules.
      - name: Test (plugin unit — message round-trip + wire contract)
        working-directory: ${{ env.PLUGIN_DIR }}
        run: npm test

      - name: Test (repo root — manifest, meters, pins, testkit)
        run: npm test

  # ===========================================================================
  # Integration Tests — spin up the full Docker cluster and run the suite
  # ===========================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    # 25, not 15: the suite outgrew 15 min when belt-corner-recovery (+2 min) landed — a job timeout
    # surfaces as conclusion "cancelled" with zero failing steps, which reads as a mystery cancellation.
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ${{ env.PLUGIN_DIR }}/package-lock.json

      # The cluster bind-mounts the plugin and must find a fresh dist/.
      - name: Build plugin
        working-directory: ${{ env.PLUGIN_DIR }}
        # Step timeout + fetch retries + one whole-command retry: an npm ci registry stall must fail
        # fast rather than eat the job budget. --ignore-scripts so prepare does not build twice.
        timeout-minutes: 10
        run: |
          NPM_FLAGS="--ignore-scripts --fetch-retries=5 --fetch-timeout=120000 --fetch-retry-maxtimeout=60000"
          npm ci $NPM_FLAGS || { echo "::warning::npm ci stalled/failed once — retrying"; npm ci $NPM_FLAGS; }
          npm run build

      - name: Create env file from example
        run: |
          cp .env.example .env
          # Set required values for CI
          sed -i 's/^INIT_CLUSTERIO_ADMIN=$/INIT_CLUSTERIO_ADMIN=ci-admin/' .env

      - name: Verify Clusterio image tag is pinned
        # A guard, not a resolver: compose interpolates .env directly. Fail here rather than let
        # compose fail later with a bare interpolation error.
        run: |
          v=$(grep -E '^CLUSTERIO_IMAGE_TAG=' .env | head -1 | cut -d= -f2-)
          test -n "$v" || { echo "::error::CLUSTERIO_IMAGE_TAG missing from .env (.env.example)"; exit 1; }
          echo "Clusterio image tag: $v"

      - name: Verify both instances pin the same Factorio version
        run: |
          # A guard, not a resolver: Clusterio downloads each instance's pinned version at runtime,
          # so a host-1/host-2 mismatch silently fetches two different engines instead of failing.
          read_ver() {
            grep -oE '"factorio\.version"[^"]*"[0-9]+\.[0-9]+\.[0-9]+"' "$1" \
              | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1
          }
          H1=docker/seed-data/hosts/clusterio-host-1/clusterio-host-1-instance-1/instance.json
          H2=docker/seed-data/hosts/clusterio-host-2/clusterio-host-2-instance-1/instance.json
          v=$(read_ver "$H1")  || true
          v2=$(read_ver "$H2") || true
          test -n "$v"   || { echo "::error::could not resolve factorio.version from $H1"; exit 1; }
          test -n "$v2"  || { echo "::error::could not resolve factorio.version from $H2"; exit 1; }
          if [ "$v" != "$v2" ]; then
            echo "::error::Factorio version mismatch — host-1=$v disagrees with host-2=$v2."
            exit 1
          fi
          echo "Pinned Factorio version (host-1 == host-2): $v — Clusterio downloads it at runtime"

      # No Factorio bake: Clusterio downloads the headless version at runtime. Measured 2026-07-25,
      # the download costs ~14s while the bake cost 86s per run with the cache warm. See docs/CI_CD.md.

      - name: Create external factorio-client volume
        run: |
          # compose declares this volume `external`, so `up` fails unless it already exists.
          docker volume create factorio-client-2111

      - name: Pull Docker images
        run: |
          docker compose pull

      - name: Start cluster
        run: |
          docker compose up -d
          echo "Waiting for cluster to be healthy..."
          # -qx: exact match. A substring match accepts the literal status "unhealthy".
          timeout 120 bash -c '
            until docker inspect --format="{{.State.Health.Status}}" surface-export-controller 2>/dev/null | grep -qx healthy; do
              sleep 5
              echo "  Waiting for controller..."
            done
          '
          echo "Controller is healthy"

      # Orders the seed's save upload ahead of the `instance start-all` below, by waiting for the
      # controller's `.seed-complete` marker. Not in the compose healthcheck: the hosts
      # `depends_on: service_healthy` while seeding waits for those hosts, which would deadlock.
      - name: Wait for seeding, and verify both instances booted their seeded save
        run: |
          await_seeded_cluster() {
            node tools/clusterio/ci-await-seeding.mjs || return $?
            node tools/clusterio/ci-verify-seeded-boot.mjs || return $?
            return 0
          }
          # -qx: exact match. A substring match accepts the literal status "unhealthy".
          wait_for_controller() {
            timeout 120 bash -c '
              until docker inspect --format="{{.State.Health.Status}}" surface-export-controller 2>/dev/null | grep -qx healthy; do
                sleep 5
                echo "  Waiting for controller..."
              done
            '
          }
          rc=0
          await_seeded_cluster || rc=$?
          if [ "$rc" -eq 0 ]; then exit 0; fi
          # Retry only the two bring-up signatures: 4 = seeding never finished, 40 = an instance
          # booted a save docker/seed-data never shipped. Any other exit goes red immediately.
          if [ "$rc" -ne 4 ] && [ "$rc" -ne 40 ]; then
            echo "::error::cluster seeding preflight failed with exit $rc — not a bring-up race; see the lines above"
            exit "$rc"
          fi
          echo "::warning::cluster bring-up hit the seed/start race (exit $rc) — rebuilding the cluster once."
          # down -v, never restart: seed-instances.sh is idempotent and would skip the save upload.
          docker compose down -v
          docker compose up -d
          if ! wait_for_controller; then
            echo "::error::controller never became healthy on the bring-up retry"
            exit 1
          fi
          rc=0
          await_seeded_cluster || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::the seed/start race reproduced on the retry (exit $rc) — this is not a flake"
            exit "$rc"
          fi

      - name: Wait for instances to start
        run: |
          CTL="docker exec surface-export-controller npx clusterioctl --config=/clusterio/tokens/config-control.json"

          # Phase 1: wait until BOTH instances are created & assigned — seeding runs in the
          # controller entrypoint and can still be in flight after its health check passes.
          echo "Waiting for both instances to be created & assigned..."
          # 120s, not 60: run 30180479602 spent ~52.5s here, ~7s of headroom against the old 60s limit.
          if ! timeout 120 bash -c '
            until [ "$(docker exec surface-export-controller npx clusterioctl \
                       --config=/clusterio/tokens/config-control.json --log-level error instance list 2>/dev/null \
                       | grep -cE "clusterio-host-[12]-instance-1")" -ge 2 ]; do
              echo "  instances not all present yet; current list:"
              docker exec surface-export-controller npx clusterioctl \
                --config=/clusterio/tokens/config-control.json instance list 2>&1 | sed "s/^/    /" || true
              sleep 4
            done
          '; then
            echo "::error::Instances were never created/assigned (seeding did not complete) — see 'Collect logs on failure'"
            $CTL instance list 2>&1 || true
            exit 1
          fi
          echo "Both instances are present."

          # Phase 2: loop `instance start-all` until both report running — it (re)starts stopped
          # instances and no-ops for running ones, so the seed's own racy start cannot leave one down.
          echo "Driving 'instance start-all' until both instances report running..."
          echo "TIMER instances-running START $(date -u +%H:%M:%S)"
          # 180s, not 90: instances download Factorio here, measured ~34s on a clean runner, and the
          # phase depends on factorio.com throughput. The TIMER lines bracket it so every run reports it.
          if ! timeout 180 bash -c '
            until [ "$(docker exec surface-export-controller npx clusterioctl \
                       --config=/clusterio/tokens/config-control.json --log-level error instance list 2>/dev/null \
                       | grep -E "clusterio-host-[12]-instance-1" | grep -c "running")" -ge 2 ]; do
              echo "  start-all (starts any stopped instances):"
              docker exec surface-export-controller npx clusterioctl \
                --config=/clusterio/tokens/config-control.json instance start-all 2>&1 | sed "s/^/    /" || true
              echo "  current state:"
              docker exec surface-export-controller npx clusterioctl \
                --config=/clusterio/tokens/config-control.json instance list 2>&1 | sed "s/^/    /" || true
              sleep 8
            done
          '; then
            echo "::error::Instances did not reach running after start-all — see 'Collect logs on failure'"
            $CTL instance list 2>&1 || true
            exit 1
          fi
          echo "TIMER instances-running END $(date -u +%H:%M:%S)"
          echo "Both instances are running"

          # `running` means the Factorio process exists, not that RCON or the save-patched module is ready.
          # Require an exact sentinel from both instances before any integration probe can send RCON.
          echo "Waiting for RCON and the surface_export module on both instances..."
          READY_COMMAND='/sc rcon.print(remote.interfaces["surface_export"] and "ci-plugin-ready" or "ci-plugin-missing")'
          READY_DEADLINE=$((SECONDS + 90))
          READY_INSTANCES=(clusterio-host-1-instance-1 clusterio-host-2-instance-1)
          declare -A LAST_READY_OUTPUT
          while true; do
            ALL_READY=true
            for instance in "${READY_INSTANCES[@]}"; do
              response="$($CTL --log-level error instance send-rcon "$instance" "$READY_COMMAND" 2>&1 || true)"
              response="$(printf '%s' "$response" | tr -d '\r' | sed '/^[[:space:]]*$/d')"
              LAST_READY_OUTPUT["$instance"]="$response"
              if [ "$response" = "ci-plugin-ready" ]; then
                echo "  $instance: ci-plugin-ready"
              else
                ALL_READY=false
                echo "  $instance: not ready (response=${response:-<empty>})"
              fi
            done
            if [ "$ALL_READY" = true ]; then
              break
            fi
            if [ "$SECONDS" -ge "$READY_DEADLINE" ]; then
              echo "::error::RCON/plugin readiness did not converge within 90s — see 'Collect logs on failure'"
              $CTL instance list 2>&1 || true
              for instance in "${READY_INSTANCES[@]}"; do
                echo "  last response from $instance: ${LAST_READY_OUTPUT[$instance]:-<empty>}"
              done
              exit 1
            fi
            sleep 3
          done
          echo "Both instances are RCON/plugin ready"
          $CTL instance list

      # The repo-root package.json, which the plugin's `npm ci` above does not cover. The canvas
      # suites need a REAL browser — jsdom returns zeros from getBoundingClientRect, which is the
      # geometry they assert on.
      - name: Install repo-root test dependencies
        timeout-minutes: 10
        run: |
          NPM_FLAGS="--fetch-retries=5 --fetch-timeout=120000 --fetch-retry-maxtimeout=60000"
          npm ci $NPM_FLAGS || { echo "::warning::root npm ci stalled/failed once — retrying"; npm ci $NPM_FLAGS; }

      - name: Resolve the pinned Playwright version
        id: playwright-version
        run: |
          v=$(node -p "require('./package-lock.json').packages['node_modules/playwright']?.version ?? ''")
          test -n "$v" || { echo "::error::could not resolve playwright's version from package-lock.json — an unkeyed browser cache would serve a stale browser after a version bump"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"
          echo "SE_PLAYWRIGHT_INSTALL_ERROR=$RUNNER_TEMP/playwright-install-error.log" >> "$GITHUB_ENV"
          echo "Playwright version: $v"

      - name: Restore cached Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright chromium
        id: playwright-install
        timeout-minutes: 10
        run: |
          set -o pipefail
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            CMD="npx playwright install-deps chromium"
          else
            CMD="npx playwright install --with-deps chromium"
          fi
          LOG="$RUNNER_TEMP/playwright-install.log"
          if $CMD 2>&1 | tee "$LOG"; then
            INSTALLED=true
          else
            INSTALLED=false
            echo "::warning::Playwright browser install failed ($CMD) — the canvas suites will report a loud SKIP and every other integration suite still runs"
            {
              grep -m1 -E "Error|error:" "$LOG" || echo "$CMD failed, with no Error line in its output"
              echo "command: $CMD"
              tail -n 15 "$LOG"
            } > "$SE_PLAYWRIGHT_INSTALL_ERROR"
          fi
          echo "installed=$INSTALLED" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true' && steps.playwright-install.outputs.installed == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium

      # One auto-discovering runner over tests/integration/*/run-tests.{ps1,mjs}: the dir set is the
      # single source of truth, so adding a test dir wires it in here with no step to maintain.
      - name: Run integration suite
        run: node tools/tests/run-integration-tests.mjs

      - name: Collect logs on failure
        if: failure()
        run: |
          # Instance status and the FULL host logs come first: a host that rejects an instance before
          # Factorio launches logs the reason here, not in factorio-current.log (which stays empty).
          echo "=== Instance status (look for 'errored'/'stopped' + the reason) ==="
          docker exec surface-export-controller \
            npx clusterioctl --config=/clusterio/tokens/config-control.json instance list 2>&1 || true
          echo ""
          echo "=== Highlighted errors across host logs (usual smoking gun) ==="
          for h in host-1 host-2; do
            echo "--- surface-export-$h ---"
            docker logs "surface-export-$h" 2>&1 \
              | grep -iE "error|unable to find|exception|fatal|cannot|failed to|not found|throw|traceback" \
              | tail -40 || true
          done
          echo ""
          echo "=== Controller Logs (tail 500) ==="
          docker logs surface-export-controller --tail 500 2>&1 || true
          echo ""
          echo "=== Host 1 Logs (tail 500) ==="
          docker logs surface-export-host-1 --tail 500 2>&1 || true
          echo ""
          echo "=== Host 2 Logs (tail 500) ==="
          docker logs surface-export-host-2 --tail 500 2>&1 || true
          echo ""
          echo "=== Host 1 Factorio Log (empty => Factorio never launched; see host log above) ==="
          docker exec surface-export-host-1 cat /clusterio/data/instances/clusterio-host-1-instance-1/factorio-current.log 2>/dev/null | tail -200 || true
          echo ""
          echo "=== Host 2 Factorio Log ==="
          docker exec surface-export-host-2 cat /clusterio/data/instances/clusterio-host-2-instance-1/factorio-current.log 2>/dev/null | tail -200 || true

      - name: Capture failing repro (payload + save) for local debugging
        if: failure()
        run: |
          # Capture the re-importable payload and the host-2 save so a CI-only failure can be
          # reproduced locally instead of through repeated CI pushes.
          mkdir -p ci-artifacts/host1-script-output ci-artifacts/host2-script-output ci-artifacts/host2-saves
          docker cp surface-export-host-1:/clusterio/data/instances/clusterio-host-1-instance-1/script-output/. ci-artifacts/host1-script-output/ 2>/dev/null || true
          docker cp surface-export-host-2:/clusterio/data/instances/clusterio-host-2-instance-1/script-output/. ci-artifacts/host2-script-output/ 2>/dev/null || true
          # Stop host-2 to flush the failed destination. `instance stop` can return before the save's
          # .tmp.zip is atomically renamed, so track the exact active save rather than an autosave/newest zip.
          HOST2=surface-export-host-2
          ACTIVE_SAVE_PATH="$(docker exec "$HOST2" sh -c '
            log=/clusterio/data/instances/clusterio-host-2-instance-1/factorio-current.log
            line=$(grep -m1 -- "--start-server" "$log" 2>/dev/null || true)
            printf "%s\n" "$line" | sed -n "s#.*\(/clusterio/data/instances/[^\"]*/saves/[^\"]*\.zip\)\".*#\1#p"
          ' 2>/dev/null || true)"
          ACTIVE_SAVE_PATH="$(printf '%s' "$ACTIVE_SAVE_PATH" | tr -d '\r\n')"
          BEFORE_STAT=absent
          TMP_SAVE_PATH=
          if [ -n "$ACTIVE_SAVE_PATH" ]; then
            BEFORE_STAT="$(docker exec "$HOST2" stat -c '%Y|%s|%i' "$ACTIVE_SAVE_PATH" 2>/dev/null || true)"
            [ -n "$BEFORE_STAT" ] || BEFORE_STAT=absent
            TMP_SAVE_PATH="${ACTIVE_SAVE_PATH%.zip}.tmp.zip"
            echo "Active host-2 save: $ACTIVE_SAVE_PATH (before=$BEFORE_STAT)"
          else
            echo "::warning::Could not resolve host-2's active save from factorio-current.log; skipping flush poll and copying any saves that exist"
          fi

          docker exec surface-export-controller sh -c 'npx clusterioctl --config /clusterio/tokens/config-control.json instance stop clusterio-host-2-instance-1' 2>&1 || true

          OBSERVED_INCOMPLETE_AFTER_STOP=false
          FINAL_STAT=absent
          FINAL_TMP=unknown
          if [ -n "$ACTIVE_SAVE_PATH" ]; then
            FLUSH_DEADLINE=$((SECONDS + 60))
            while true; do
              FINAL_STAT="$(docker exec "$HOST2" stat -c '%Y|%s|%i' "$ACTIVE_SAVE_PATH" 2>/dev/null || true)"
              [ -n "$FINAL_STAT" ] || FINAL_STAT=absent
              if docker exec "$HOST2" test -e "$TMP_SAVE_PATH" 2>/dev/null; then FINAL_TMP=true; else FINAL_TMP=false; fi
              IFS='|' read -r before_mtime _ before_inode <<< "${BEFORE_STAT//absent/0|0|0}"
              IFS='|' read -r final_mtime final_size final_inode <<< "${FINAL_STAT//absent/0|0|0}"
              if [ "$FINAL_TMP" = false ] \
                && [ "${final_mtime:-0}" -gt "${before_mtime:-0}" ] \
                && [ "${final_inode:-0}" -ne "${before_inode:-0}" ] \
                && [ "${final_size:-0}" -gt 0 ]; then
                echo "save-flush complete path=$ACTIVE_SAVE_PATH before=$BEFORE_STAT after=$FINAL_STAT tmp=$FINAL_TMP observed_incomplete_after_stop=$OBSERVED_INCOMPLETE_AFTER_STOP"
                break
              fi
              OBSERVED_INCOMPLETE_AFTER_STOP=true
              if [ "$SECONDS" -ge "$FLUSH_DEADLINE" ]; then
                echo "::warning::Save flush did not complete within 60s; captured save may be stale or truncated. path=$ACTIVE_SAVE_PATH before=$BEFORE_STAT final=$FINAL_STAT tmp_exists=$FINAL_TMP"
                break
              fi
              sleep 2
            done
          fi

          docker cp surface-export-host-2:/clusterio/data/instances/clusterio-host-2-instance-1/saves/. ci-artifacts/host2-saves/ 2>/dev/null || true
          FOUND_SAVE=false
          while IFS= read -r save; do
            FOUND_SAVE=true
            if unzip -t "$save" >/dev/null 2>&1; then
              echo "save-zip valid: $save"
            else
              echo "::warning::Captured save is not unzip-valid: $save"
            fi
          done < <(find ci-artifacts/host2-saves -maxdepth 1 -type f -name '*.zip' -print 2>/dev/null)
          if [ "$FOUND_SAVE" = false ]; then
            echo "::warning::No host-2 save zip was captured"
          fi
          echo "=== captured artifact sizes ===" ; du -sh ci-artifacts/* 2>/dev/null || true
          find ci-artifacts/host1-script-output -maxdepth 1 -type f -iname '*debug_source*' -printf '%f\n' 2>/dev/null || true

      - name: Upload failing repro artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failing-repro
          path: ci-artifacts/
          retention-days: 5
          if-no-files-found: warn

      - name: Stop cluster
        if: always()
        run: |
          docker compose down -v

  # ===========================================================================
  # Publish to npm — only on version tags after tests pass
  # ===========================================================================
  publish:
    name: Publish to npm
    needs: [integration-tests, fast-checks]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      id-token: write  # For npm provenance

    environment: npm-publish

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: ${{ env.PLUGIN_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.PLUGIN_DIR }}
        run: npm ci

      - name: Build plugin
        working-directory: ${{ env.PLUGIN_DIR }}
        run: npm run build

      - name: Verify version matches tag
        working-directory: ${{ env.PLUGIN_DIR }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Package version: $PACKAGE_VERSION"
          echo "Tag version:     $TAG_VERSION"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch! package.json=$PACKAGE_VERSION, tag=$TAG_VERSION"
            exit 1
          fi

      - name: Publish to npm
        working-directory: ${{ env.PLUGIN_DIR }}
        run: npm publish --provenance --access public
